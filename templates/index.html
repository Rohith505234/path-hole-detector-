<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pothole Detection System</title>
    <style>
        html, body {
            height: 100%;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Clean road background image */
            background: url('https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
        }
        /* Overlay to make text readable */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.7); /* Dark blue overlay */
            backdrop-filter: blur(5px);
            z-index: -1;
        }
        nav {
            background: rgba(30, 41, 59, 0.95); /* Dark Slate */
            color: #f8fafc;
            padding: 15px 20px;
            font-size: 2.5em;
            text-align: center;
            font-weight: 700;
            letter-spacing: 1px;
            border-radius: 0 0 20px 20px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: #334155; /* Slate 700 */
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            flex: 1 0 auto;
            width: 90%;
        }
        .card {
            padding: 30px;
            border-radius: 16px;
            background: #1e293b; /* Slate 800 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 20px;
            color: #e2e8f0;
            border: 1px solid #475569;
        }
        .result { margin-top: 20px; }
        .result-box {
            background: #0f172a;
            border: 1px solid #38bdf8; /* Light blue border */
            border-radius: 8px;
            padding: 15px;
            height: 200px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 1.1em;
            margin-top: 10px;
        }
        .result-box pre {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            border: none;
            background: transparent;
            font-size: 1em;
            color: #7dd3fc; /* Light Blue text */
            white-space: pre-line;
            overflow-y: auto;
            font-family: monospace;
        }
        .warn { color: #f87171; font-weight: bold; margin-bottom: 8px; }
        .row { display: flex; gap: 24px; }
        .col { flex: 1; }
        #cameraBox { text-align: center; margin-top: 15px; }
        #video { width: 100%; max-width: 400px; border-radius: 8px; margin-bottom: 12px; border: 2px solid #475569; }
        
        /* Button Styling */
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background-color: #2563eb; }
        input[type="file"] {
            color: #e2e8f0;
            margin-top: 10px;
        }
        /* Footer style */
        footer {
            background: rgba(30, 41, 59, 0.95);
            color: #94a3b8;
            text-align: center;
            padding: 15px 0;
            font-size: 1em;
            margin-top: 40px;
            flex-shrink: 0;
            border-top: 1px solid #475569;
        }
    </style>
</head>
<body>
    <nav>Pothole Detection System</nav>
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="card">
                    <h2>Detection Mode</h2>
                    <!-- Toggle buttons for Upload vs Camera -->
                    <div style="margin-bottom:20px;">
                        <button type="button" id="uploadModeBtn">Upload Image</button>
                        <button type="button" id="cameraModeBtn">Live Camera</button>
                    </div>
                    <!-- Form for uploading images -->
                    <form id="uploadForm" enctype="multipart/form-data" style="display:block;">
                        <input type="file" name="file" accept="image/*" required>
                    </form>
                    <!-- Camera section -->
                    <div id="cameraBox" style="display:none;">
                        <video id="video" autoplay></video><br>
                        <button id="captureBtn">Capture & Detect</button>
                    </div>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <h2>Detection Result</h2>
                    <img id="detectedImg" style="max-width:100%;border-radius:8px;display:none; margin-bottom: 10px;" />
                    <div class="result-box" id="result"></div>
                </div>
            </div>
        </div>
    </div>
    <footer>
      
    </footer>
    
    <script>
        // --- Mode Toggling Logic ---
        const uploadModeBtn = document.getElementById('uploadModeBtn');
        const cameraModeBtn = document.getElementById('cameraModeBtn');
        const uploadForm = document.getElementById('uploadForm');
        const cameraBox = document.getElementById('cameraBox');

        uploadModeBtn.onclick = function() {
            uploadForm.style.display = 'block';
            cameraBox.style.display = 'none';
            stopCameraDetection(); // Stop live feed if switching
        };

        cameraModeBtn.onclick = function() {
            uploadForm.style.display = 'none';
            cameraBox.style.display = 'block';
            startCameraDetection();
        };

        // --- Upload Image Logic ---
        uploadForm.file.onchange = async function(e) {
            if (this.files.length > 0) {
                const formData = new FormData(uploadForm);
                
                // Show loading state (optional but good practice)
                document.getElementById('result').innerHTML = '<pre>Processing image...</pre>';

                const res = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                showResult(data);
            }
        };

        // --- Camera Logic ---
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('captureBtn');
        let cameraStreamStarted = false;
        let cameraInterval = null;

        // Start video stream on first click
        cameraModeBtn.addEventListener('click', function() {
            if (!cameraStreamStarted) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(stream => { 
                        video.srcObject = stream; 
                        cameraStreamStarted = true; 
                    })
                    .catch(err => { 
                        alert("Camera access denied or not available.");
                        video.style.display = 'none'; 
                        captureBtn.style.display = 'none'; 
                    });
            }
        });

        // Auto detect from camera every 2 seconds
        function startCameraDetection() {
            if (cameraInterval) return;
            cameraInterval = setInterval(async function() {
                if (video.videoWidth && video.videoHeight) {
                    const canvas = document.createElement('canvas');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async function(blob) {
                        const formData = new FormData();
                        formData.append('file', blob, 'capture.jpg');
                        const res = await fetch('/detect', {
                            method: 'POST',
                            body: formData
                        });
                        const data = await res.json();
                        showResult(data);
                    }, 'image/jpeg');
                }
            }, 2000); // 2000ms = 2 seconds
        }

        // Stop camera detection to save CPU
        function stopCameraDetection() {
            if (cameraInterval) {
                clearInterval(cameraInterval);
                cameraInterval = null;
            }
        }

        // --- Result Display Logic ---
        function showResult(data) {
            const resultDiv = document.getElementById('result');
            const detectedImg = document.getElementById('detectedImg');
            resultDiv.innerHTML = '';
            
            // If backend returns an image with drawn boxes, display it
            if (data.image) {
                detectedImg.src = 'data:image/jpeg;base64,' + data.image;
                detectedImg.style.display = 'block';
            } else {
                detectedImg.style.display = 'none';
            }

            // Display text warnings/success
            let warnings = '';
            if (data.potholes && data.potholes.length > 0) {
                data.potholes.forEach((pothole, idx) => {
                    warnings += `⚠️ Pothole Detected!\n`;
                    warnings += `   Severity: ${pothole.severity}\n`;
                    warnings += `   Size: ${pothole.size}\n`;
                    warnings += `   Confidence: ${Math.round(pothole.score*100)}%\n\n`;
                });
            } else {
                warnings = '✅ No potholes detected. Road is clear.';
            }
            resultDiv.innerHTML = `<pre>${warnings}</pre>`;
        }
    </script>
</body>
</html>
